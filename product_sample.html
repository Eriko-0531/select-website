<script>
/* ============================================================
   G-SELECT アイテム一覧：Googleスプレッドシート連携版
   アイテムの追加・更新はスプレッドシートの編集だけで完結する。
   スプレッドシート（3タブ：アイテム / ギャラリー / リンク）:
   https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPsDWVO7v8xe2yuXyd-pc3bEMh9PAnC5gzkN54uYyPKyvWsJDP02GjHHgioX2twSQKVFuVk96qIE4/
============================================================ */
const SHEET_URLS = {
  items:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPsDWVO7v8xe2yuXyd-pc3bEMh9PAnC5gzkN54uYyPKyvWsJDP02GjHHgioX2twSQKVFuVk96qIE4/pub?gid=0&single=true&output=csv',
  gallery: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPsDWVO7v8xe2yuXyd-pc3bEMh9PAnC5gzkN54uYyPKyvWsJDP02GjHHgioX2twSQKVFuVk96qIE4/pub?gid=491038696&single=true&output=csv',
  links:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPsDWVO7v8xe2yuXyd-pc3bEMh9PAnC5gzkN54uYyPKyvWsJDP02GjHHgioX2twSQKVFuVk96qIE4/pub?gid=1987332531&single=true&output=csv'
};

/* 最小限のCSVパーサー（ダブルクォート内のカンマ・改行に対応） */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field = '';
        if(row.some(v => v !== '')) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] ?? '').trim()])));
}

async function loadCSV(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* カードHTML生成 */
function buildCard(item, galleryMap, linksMap){
  const gallery = galleryMap[item.id] || [];
  const links = linksMap[item.id] || [];
  const hasGallery = gallery.length > 0;

  const colorsHtml = item.colors
    ? `<div><span class="label">Color</span><span class="colors">` +
      item.colors.split(',').filter(Boolean).map(hex => `<span style="background:#${hex.trim()}"></span>`).join('') +
      `</span></div>`
    : '';
  const sizeHtml = item.size ? `<div><span class="label">Size</span><span class="size">${escapeHtml(item.size)}</span></div>` : '';
  const brandHtml = item.brand ? `<div class="brand">${escapeHtml(item.brand)}</div>` : '';
  const buttonsHtml = links.map(l => `<a class="button" href="${escapeHtml(l.url)}" target="_blank">${escapeHtml(l.label)}</a>`).join('');

  const card = document.createElement('div');
  card.className = 'card';
  if(hasGallery) card.setAttribute('data-gallery', JSON.stringify(gallery));
  card.innerHTML = `
    <div class="card-img-wrapper">
      ${hasGallery ? '<span class="tag">施工例を見る</span>' : ''}
      <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.brand)} ${escapeHtml(item.title)}" loading="lazy">
    </div>
    <div class="card-body">
      ${brandHtml}
      <div class="title">${escapeHtml(item.title)}</div>
      <div class="subtitle">${escapeHtml(item.subtitle)}</div>
      <div class="desc">${escapeHtml(item.desc)}</div>
      ${sizeHtml}
      ${colorsHtml}
    </div>
    ${buttonsHtml}
  `;
  return card;
}

/* ギャラリーモーダル */
const modal = document.getElementById('galleryModal');
const modalImg = document.getElementById('galleryMainImage');
const modalText = document.getElementById('galleryMainText');
const modalThumbs = document.getElementById('galleryThumbs');
let modalItems = [], modalIndex = 0;

function openGallery(items, index){
  modalItems = items; modalIndex = index;
  renderModal();
  modal.classList.add('open');
  modal.style.display = 'flex';
}
function closeGallery(){
  modal.classList.remove('open');
  modal.style.display = 'none';
}
function renderModal(){
  const it = modalItems[modalIndex];
  modalImg.src = it.src;
  modalText.textContent = it.text || '';
  modalThumbs.innerHTML = modalItems.map((g, i) =>
    `<img src="${escapeHtml(g.src)}" class="${i === modalIndex ? 'active' : ''}" data-i="${i}">`
  ).join('');
  Array.prototype.forEach.call(modalThumbs.querySelectorAll('img'), img => {
    img.addEventListener('click', () => { modalIndex = +img.dataset.i; renderModal(); });
  });
}
document.querySelector('.gallery-close').addEventListener('click', closeGallery);
document.querySelector('.gallery-arrow.left').addEventListener('click', () => { modalIndex = (modalIndex - 1 + modalItems.length) % modalItems.length; renderModal(); });
document.querySelector('.gallery-arrow.right').addEventListener('click', () => { modalIndex = (modalIndex + 1) % modalItems.length; renderModal(); });
modal.addEventListener('click', e => { if(e.target === modal) closeGallery(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeGallery(); });

/* スライダー */
function initSlider(container){
  const track = container.querySelector('.slider-track');
  const slides = Array.from(track.querySelectorAll('.card'));
  const prevBtn = container.querySelector('.arrow.prev');
  const nextBtn = container.querySelector('.arrow.next');
  const dotsWrap = container.querySelector('.dots');
  if(!slides.length) return;

  let slidesPerView = window.innerWidth <= 768 ? 1 : 3;
  let currentIndex = 0;

  function createDots(){
    dotsWrap.innerHTML = '';
    slides.forEach((_, i) => {
      const dot = document.createElement('span');
      if(i === 0) dot.classList.add('active');
      dot.addEventListener('click', () => { currentIndex = i; update(); });
      dotsWrap.appendChild(dot);
    });
    return Array.from(dotsWrap.children);
  }
  let dots = createDots();

  function slideWidth(){
    const style = getComputedStyle(slides[0]);
    return slides[0].offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
  }
  function update(){
    track.style.transform = `translateX(${-slideWidth() * currentIndex}px)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  }
  function next(){
    const max = slides.length - slidesPerView;
    currentIndex = currentIndex >= max ? 0 : currentIndex + 1;
    update();
  }
  function prev(){
    const max = slides.length - slidesPerView;
    currentIndex = currentIndex <= 0 ? max : currentIndex - 1;
    update();
  }
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);

  let startX = 0;
  container.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  container.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].clientX - startX;
    if(Math.abs(diff) > 50) (diff < 0 ? next() : prev());
  });

  window.addEventListener('resize', () => {
    slidesPerView = window.innerWidth <= 768 ? 1 : 3;
    update();
  });
  update();

  slides.forEach(card => {
    const gallery = card.getAttribute('data-gallery');
    if(!gallery) return;
    card.querySelector('.card-img-wrapper').addEventListener('click', () => {
      openGallery(JSON.parse(gallery), 0);
    });
  });
}

/* 起動処理：3つのCSVを読み込み、カテゴリーごとにカードを描画 */
(async function(){
  const containers = document.querySelectorAll('.slider-container[data-category]');
  try{
    const [items, galleryRows, linkRows] = await Promise.all([
      loadCSV(SHEET_URLS.items),
      loadCSV(SHEET_URLS.gallery),
      loadCSV(SHEET_URLS.links)
    ]);

    const galleryMap = {};
    galleryRows.forEach(g => { (galleryMap[g.itemId] ??= []).push({ src: g.src, text: g.text }); });
    const linksMap = {};
    linkRows.forEach(l => { (linksMap[l.itemId] ??= []).push({ label: l.label, url: l.url }); });

    containers.forEach(container => {
      const cat = container.dataset.category;
      const track = container.querySelector('.slider-track');
      items.filter(it => it.category === cat).forEach(it => {
        track.appendChild(buildCard(it, galleryMap, linksMap));
      });
      initSlider(container);
    });
  } catch(err){
    console.error('商品データの読み込みに失敗しました', err);
    containers.forEach(container => {
      container.querySelector('.slider-track').innerHTML =
        '<p style="padding:20px;color:#999;">商品情報の読み込みに失敗しました。時間をおいて再度お試しください。</p>';
    });
  }
})();
</script>
